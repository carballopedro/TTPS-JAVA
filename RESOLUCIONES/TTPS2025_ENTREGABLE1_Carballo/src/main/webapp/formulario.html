<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario - Compra de Entradas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<form action="ImprimeEntrada" method="post" accept-charset="UTF-8">
    <h2 style="text-align:center; color:#ff7043; margin-bottom: 1rem;">
        Compra de Entradas
    </h2>
    <label for="nombres">Nombres:</label>
    <input type="text" id="nombres" name="nombres" required><br><br>

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" required><br><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="dni">DNI:</label>
    <input type="text" id="dni" name="dni" required><br><br>

    <label for="pelicula">Película:</label>
    <select id="pelicula" name="pelicula" required>
        <option value="LILO & STICH">LILO & STICH</option>
        <option value="LA MUJER DE LA FILA">LA MUJER DE LA FILA</option>
        <option value="DEMON SLAYER">DEMON SLAYER</option>
        <option value="LA LUZ QUE IMAGINAMOS">LA LUZ QUE IMAGINAMOS</option>
    </select><br><br>

    <label for="cantidad">Cantidad de entradas:</label>
    <input type="number" id="cantidad" name="cantidad" min="1" required><br><br>

    <button type="submit">Comprar</button>
    <a href="VisualizarEstadistica" style="text-align:center; color:#ff7043; margin-top:0.6rem; text-decoration:none; font-weight:bold;">
        Visualizar Estadística
    </a>
</form>
</body>
</html>
